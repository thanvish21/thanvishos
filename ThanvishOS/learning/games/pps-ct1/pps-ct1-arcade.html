<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PPS CT1 Arcade – Quick Practice</title>
<style>
  body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:0;padding:20px}
  .exp{border:1px solid #444;padding:15px;margin-bottom:10px;background:#222}
  .exp h2{margin:0 0 8px;font-size:1.2rem;color:#ffd644}
  .opt{display:block;margin:4px 0;padding:6px;background:#333;color:#eee;border:none;cursor:pointer}
  .opt:hover{background:#444}
  .opt.correct{background:#3ddc84;color:#000}
  .opt.wrong{background:#ff5470;color:#000}
  #score{font-size:1.2rem;margin-bottom:20px}
</style>
</head>
<body>
<div id="score">Score: 0 / 0</div>
<div id="list"></div>
<script>
const experiments=[
  {id:1,title:"Arithmetic Expression",q:"a+b*c (a=2,b=3,c=4)",options:["14","12","10","9"],answer:0},
  {id:2,title:"Parentheses vs Precedence",q:"(a+b)*c (a=2,b=3,c=4)",options:["20","14","12","8"],answer:0},
  {id:3,title:"Multiple Operators",q:"a+b*c-d (a=6,b=3,c=2,d=1)",options:["11","13","9","15"],answer:0},
  {id:4,title:"Division & Multiplication",q:"a+b/c*d (a=15,b=3,c=2,d=1)",options:["17","15","14","13"],answer:0},
  {id:5,title:"Modulus",q:"a+b% c (a=7,b=3,c=2)",options:["8","7","9","6"],answer:0},
  {id:6,title:"Parentheses Grouping",q:"(a+b)*(c-d) (a=5,b=3,c=10,d=4)",options:["48","64","40","32"],answer:0},
  {id:7,title:"Swap with Temp",q:"After swap a=5,b=10, values?",options:["a=10,b=5","a=5,b=10","a=15,b=15","a=0,b=0"],answer:0},
  {id:8,title:"Swap without Temp",q:"a=5,b=10 after a=a+b;b=a-b;a=a-b",options:["a=10,b=5","a=5,b=10","a=15,b=5","a=0,b=0"],answer:0},
  {id:9,title:"Odd/Even",q:"n%2==0 for n=4?",options:["true","false"],answer:0},
  {id:10,title:"Positive/Negative",q:"n>0 for n=-3?",options:["true","false"],answer:1},
  {id:11,title:"Leap Year",q:"2000 is leap?",options:["yes","no"],answer:0},
  {id:12,title:"Vowel Check",q:"'a' is a vowel?",options:["yes","no"],answer:0},
  {id:13,title:"Digit Check",q:"'7' is a digit?",options:["yes","no"],answer:0},
  {id:14,title:"Scholarship",q:"marks>=80 && attend>=75 (85,80)",options:["yes","no"],answer:0},
  {id:15,title:"Menu Calculator",q:"Choose operation 3 (multiply) for 4 and 5",options:["20","9","1","0"],answer:0},
  {id:16,title:"Bank Account",q:"Initial $5000, withdraw $2000, balance?",options:["3000","5000","2000","7000"],answer:0},
  {id:17,title:"Triangle Type",q:"2,2,2 forms?",options:["Equilateral","Isosceles","Scalene","Not a triangle"],answer:0},
  {id:18,title:"Number to Word",q:"7 -> ?",options:["seven","sevn","7","seben"],answer:0},
  {id:19,title:"Traffic Light",q:"Input 'R' shows?",options:["Stop!","Go!","Slow down","Unknown"],answer:0},
  {id:20,title:"Month Days",q:"February in leap year?",options:["29","28"],answer:0},
  {id:21,title:"Food Ordering",q:"Pizza price?",options:["250","100","150","180"],answer:0},
  {id:22,title:"Switch vs If",q:"Prefer switch for fixed menu?",options:["yes","no"],answer:0},
  {id:23,title:"Square Function",q:"square(7)=?",options:["49","56","42","64"],answer:0},
  {id:24,title:"Sum Even Numbers",q:"First 5 even numbers sum?",options:["30","20","15","40"],answer:0},
  {id:25,title:"Largest Function",q:"largest(12,8)=?",options:["12","8","10","14"],answer:0}
];
let total=0, correct=0;
const list=document.getElementById('list');
experiments.forEach((exp,i)=>{
  const div=document.createElement('div');
  div.className='exp';
  const h=document.createElement('h2');
  h.textContent=`${i+1}. ${exp.title}`;
  const p=document.createElement('p');
  p.textContent=exp.q;
  div.appendChild(h);div.appendChild(p);
  exp.options.forEach((opt,idx)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=opt;
    btn.onclick=()=>{
      if(btn.disabled) return;
      total++; if(idx===exp.answer){correct++; btn.classList.add('correct');} else btn.classList.add('wrong');
      // disable all options for this question
      const all=div.querySelectorAll('.opt');
      all.forEach(b=>b.disabled=true);
      document.getElementById('score').textContent=`Score: ${correct} / ${total}`;
    };
    div.appendChild(btn);
  });
  list.appendChild(div);
});
</script>
</body>
</html>
